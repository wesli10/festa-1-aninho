    const snap = {
      festa: { nome:S.settings.babyName||null, data:S.settings.partyDate||null,
               local:S.settings.venue||null, orcamento:S.settings.budget||null },
      resumo: {
        pessoas_confirmadas: t.peopleConf, pessoas_pendentes: t.peoplePend,
        total_gasto: t.spentTotal, ja_pago: t.spentPaid, falta_pagar: t.spentPend,
        sobra_do_orcamento: S.settings.budget ? S.settings.budget - t.spentTotal : null,
        tarefas_feitas: `${t.checkDone} de ${t.checkTotal}`,
        pessoas_usadas_na_calculadora: expectedPeople(),
      },
      convidados: S.guests.map(g => ({ id:g.id, nome:g.name, adultos:g.adults, criancas:g.children,
        telefone:g.phone||null, status:g.status })),
      checklist: S.checklist.map(c => ({ id:c.id, tarefa:c.text, feita:c.done })),
      gastos: S.expenses.map(e => ({ id:e.id, descricao:e.description, categoria:e.category,
        valor_total:e.amount, ja_pago:paidOf(e), falta_pagar:dueOf(e) })),
      anotacoes: S.notes.map(n => ({ id:n.id, texto:n.text, data:n.date })),
      quantidades_por_pessoa: CALC_ITEMS.map(i => ({ item:i.name, por_pessoa:(rates[i.id] ?? i.rate), unidade:i.unit })),
    };
    return [
      "Você é a assistente de organização de uma festa de 1 aninho, dentro de um app que a mãe da aniversariante usa no celular.",
      "Fale português do Brasil, em tom leve e carinhoso, e vá direto ao ponto: 2 a 4 frases no máximo.",
      "Não use markdown, nem tabelas, nem listas com asteriscos ou hífens — só texto corrido com quebras de linha.",
      "Valores sempre em reais, escritos como R$ 1.234,56.",
      "",
      "Você tem ferramentas para alterar os dados da festa. Use-as sempre que ela pedir para adicionar, mudar, marcar ou remover algo — não peça confirmação, faça e depois confirme em uma frase curta o que foi feito (ela pode desfazer no app).",
      "Para alterar ou remover, use o id exato que aparece nos dados abaixo. Nunca invente um id.",
      "Se ela pedir várias coisas de uma vez, chame várias ferramentas.",
      "Nunca invente informação: se não estiver nos dados abaixo, diga que não está anotado e ofereça anotar.",
      "",
      `Hoje é ${new Date().toLocaleDateString("pt-BR", { dateStyle:"full" })}.`,
      dl == null ? "A data da festa ainda não foi definida."
        : dl > 0 ? `Faltam ${dl} dias para a festa.`
        : dl === 0 ? "A festa é hoje!" : `A festa já aconteceu há ${-dl} dias.`,
      "",
      "DADOS ATUAIS DA FESTA (JSON):",
      JSON.stringify(snap, null, 1),
    ].join("\n");
  }

  const isPergunta = it => it.type === "message" && it.role === "user";

  // Histórico enviado à API. Só entram itens que a API entende — os avisos de erro
  // são só de tela. O corte começa sempre numa pergunta dela, pra não deixar um
  // function_call_output órfão (sem o function_call que o originou).
  function aiHistory(){
    const items = chatLog.filter(it => !String(it.type).startsWith("__"));
    if (items.length <= AI_MAX_ITEMS) return items;
    let i = items.length - AI_MAX_ITEMS;
    while (i < items.length - 1 && !isPergunta(items[i])) i++;
    return items.slice(i);
  }

  async function aiCall(){
    const r = await fetch(AI_URL, {
      method: "POST",
      headers: { "content-type": "application/json", "authorization": "Bearer " + aiKey() },
      body: JSON.stringify({
        model: AI_MODEL,
        instructions: aiSystem(),
        input: aiHistory(),
        tools: AI_TOOLS,
        reasoning: { effort: AI_EFFORT },
        max_output_tokens: 2000,
        store: false,          // a conversa não fica guardada no servidor da OpenAI
      }),
    });
    if (!r.ok) {
      let detail = "", code = "";
      try { const j = await r.json(); detail = j?.error?.message || ""; code = j?.error?.code || j?.error?.type || ""; } catch {}
      const err = new Error(detail); err.status = r.status; err.code = code; throw err;
    }
    return r.json();
  }

  function aiErrorText(e){
    if (e.status === 401) return "Chave da OpenAI inválida ou expirada. Toque em 🔑 lá em cima pra corrigir.";
    if (e.status === 403) return "Essa chave não tem permissão pra usar este modelo.";
    if (e.code === "insufficient_quota" || /quota|billing/i.test(e.message||""))
      return "A conta da OpenAI está sem créditos. Adicione créditos em platform.openai.com.";
    if (e.status === 429) return "Muitas perguntas seguidas. Espera uns segundos e tenta de novo. 🙂";
    if (e.status >= 500) return "O serviço da OpenAI está instável agora. Tenta de novo daqui a pouco.";
    if (e.status) return `Deu erro na IA (${e.status}). ${e.message || ""}`.trim();
    return "Não consegui conectar. Verifica a internet e tenta de novo.";
  }

  async function aiSend(text){
    text = text.trim();
    if (!text || chatBusy) return;
    if (!navigator.onLine) {
      chatLog.push({ type:"__pergunta", text });
      chatLog.push({ type:"__erro", text:"Você está sem internet. O assistente precisa de conexão — o resto do app continua funcionando normalmente." });
      saveChat(); paintChat(); return;
    }

    const mark = chatLog.length;   // ponto de retorno: um turno que falhou não pode ficar no histórico
    const before = JSON.stringify(S);
    let mutated = false, done = false, problema = null;

    chatLog.push({ type:"message", role:"user", content:text });
    chatBusy = true;
    saveChat(); paintChat();

    try {
      for (let hop = 0; hop < AI_MAX_HOPS && !done; hop++) {
        const res = await aiCall();
        const out = Array.isArray(res.output) ? res.output : [];
        if (!out.length) { problema = "A IA respondeu vazio. Tenta perguntar de novo."; break; }
        // Devolve os itens da resposta ao histórico exatamente como vieram — a API
        // precisa do function_call original pra casar com o function_call_output.
        out.forEach(it => chatLog.push(it));

        const chamadas = out.filter(it => it.type === "function_call");
        if (!chamadas.length) {
          if (res.status === "incomplete")
            problema = "A resposta ficou longa demais e foi cortada. Tenta perguntar de um jeito mais simples.";
          done = true;
          break;
        }

        for (const fc of chamadas) {
          let saida;
          try {
            const args = fc.arguments ? JSON.parse(fc.arguments) : {};
            const run = AI_RUN[fc.name];
            if (!run) throw new Error(`Ferramenta "${fc.name}" não existe.`);
            saida = run(args);
            mutated = true;
          } catch (err) {
            saida = { erro: String(err.message || err) };
          }
          chatLog.push({ type:"function_call_output", call_id:fc.call_id, output:JSON.stringify(saida) });
        }
        saveChat(); paintChat();
      }
      if (!done && !problema) problema = "Fiz o que deu, mas a conversa ficou longa demais pra terminar. Confere no app e me pergunta de novo se faltou algo.";
    } catch (e) {
      problema = aiErrorText(e);
    }

    if (problema) {
      // Descarta o turno quebrado do histórico (senão sobra um function_call sem
      // resposta, e a API rejeita a conversa inteira daí em diante) e deixa só o
      // registro na tela.
      chatLog.length = mark;
      chatLog.push({ type:"__pergunta", text });
      chatLog.push({ type:"__erro", text:problema });
    }
    if (mutated) { undoSnap = before; save(); renderHeader(); }
    chatBusy = false;
    saveChat(); paintChat();
  }

  // ---- UI ----
  let chatBox = null, chatInput = null;

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
  const mdLite = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");

  function askKey(){
    const inp = el("input", { class:"t", type:"password", value:aiKey(), placeholder:"sk-...", autocomplete:"off", spellcheck:"false" });
    openModal("Chave da IA", el("div", { class:"stack" }, [
      el("p", { class:"hint", style:"line-height:1.6", html:
        'Crie uma chave em <a href="https://platform.openai.com/api-keys" target="_blank" rel="noopener">platform.openai.com</a> e cole aqui. '+
        'Ela fica guardada <b>só neste aparelho</b> e é usada apenas para falar com o assistente.' }),
      field("Chave da OpenAI", inp),
    ]), () => {
      const v = inp.value.trim();
      if (v) localStorage.setItem(AI_KEY_STORE, v); else localStorage.removeItem(AI_KEY_STORE);
      renderChat();
    });
  }

  function renderChat(){
    const c = $("#view-chat"); c.innerHTML = "";
    chatBox = null; chatInput = null;

    if (!aiKey()) {
      viewHead(c, "Assistente", null);
      c.append(el("div", { class:"card keycard" }, [
        el("div", { class:"em" }, "✨"),
        el("p", { html:"Pergunte qualquer coisa sobre a festa — e peça pra anotar convidados, gastos e tarefas por você.<br><br>Pra começar, é preciso uma chave de API da OpenAI." }),
        el("div", { style:"margin-top:16px" }, el("button", { class:"btn", onclick:askKey }, "🔑 Configurar chave")),
      ]));
      return;
    }

    viewHead(c, "Assistente", null, el("div", { style:"display:flex;gap:6px" }, [
      chatLog.length ? el("button", { class:"btn ghost sm", title:"Limpar conversa", onclick:()=>{
        if (!confirm("Apagar a conversa com o assistente? Os dados da festa não são afetados.")) return;
        chatLog = []; undoSnap = null; saveChat(); renderChat();
      } }, "🧹") : null,
      el("button", { class:"btn ghost sm", title:"Trocar a chave da IA", onclick:askKey }, "🔑"),
    ]));

    chatBox = el("div", { class:"chat-log" });
    c.append(chatBox);

    const ta = el("textarea", { class:"t", rows:1, placeholder:"Pergunte ou peça algo…", "aria-label":"Mensagem para o assistente" });
    chatInput = ta;
    const grow = () => { ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 140) + "px"; };
    ta.addEventListener("input", grow);
    ta.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey && innerWidth >= 560) { e.preventDefault(); fire(); }
    });
    const btn = el("button", { class:"btn send", title:"Enviar", "aria-label":"Enviar", onclick:()=>fire() }, "➤");
    function fire(){
      if (chatBusy) return;
      const v = ta.value;
      ta.value = ""; grow();
      aiSend(v);
    }
    c.append(el("div", { class:"chat-bar" }, [ ta, btn ]));
    c.append(el("p", { class:"hint", style:"text-align:center;margin-top:8px" },
      "Precisa de internet. Os dados da festa são enviados à IA para responder."));

    paintChat();
  }

  function paintChat(){
    if (!chatBox) return;
    chatBox.innerHTML = "";

    if (!chatLog.length) {
      chatBox.append(el("div", { class:"card keycard", style:"margin-bottom:6px" }, [
        el("div", { class:"em" }, "✨"),
        el("p", { html:"Oi! Posso responder sobre a festa e anotar as coisas pra você.<br>Experimente:" }),
      ]));
      const sug = el("div", { class:"chat-sugg" });
      ["Quanto já gastei até agora?", "Quem ainda não confirmou?", "O que ainda falta fazer?",
       "Quantos salgadinhos preciso comprar?", "Anota que a vovó Ana vem com 2 adultos"]
        .forEach(q => sug.append(el("button", { onclick:()=>aiSend(q) }, q)));
      chatBox.append(sug);
    }

    let acts = null;   // agrupa os chips de ação que vêm em sequência
    const flush = () => { if (acts) { chatBox.append(acts); acts = null; } };

    chatLog.forEach(it => {
      if (it.type === "__pergunta" || isPergunta(it)) {
        flush();
        chatBox.append(el("div", { class:"msg me" }, it.text ?? it.content));
      } else if (it.type === "__erro") {
        flush();
        chatBox.append(el("div", { class:"msg err" }, it.text));
      } else if (it.type === "message" && it.role === "assistant") {
        flush();
        (it.content || []).forEach(b => {
          const t = (b.text || "").trim();
          if (b.type === "output_text" && t) chatBox.append(el("div", { class:"msg ai", html:mdLite(t) }));
        });
      } else if (it.type === "function_call") {
        let args = {};
        try { args = JSON.parse(it.arguments || "{}"); } catch {}
        if (!acts) acts = el("div", { class:"acts" });
        acts.append(el("span", { class:"act" }, (ACT_LBL[it.name] || (()=>"✔ " + it.name))(args)));
      }
      // function_call_output e reasoning não aparecem na conversa
    });
    flush();

    if (chatBusy) chatBox.append(el("div", { class:"typing" }, [el("i"), el("i"), el("i")]));
    else if (undoSnap) chatBox.append(el("div", { class:"acts" },
      el("button", { class:"act undo", onclick:()=>{
        S = JSON.parse(undoSnap); undoSnap = null;
        save(); renderHeader(); paintChat();
      } }, "↩ Desfazer as alterações")));

    if (current === "chat") requestAnimationFrame(() => scrollTo({ top: document.body.scrollHeight }));
  }

  // ===== boot =====
  renderHeader();
  selectTab("resumo");
})();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}</script>
